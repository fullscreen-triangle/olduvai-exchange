[package]
name = "olduvai-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP surface over olduvai-core. Transport only — no business logic."

[dependencies]
olduvai-core.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# ⚠️ Test-only. `ServiceExt::oneshot` drives the router as a plain function of a request,
# with no socket and no runtime port — so the endpoint tests below assert on what the routes
# return rather than on whether a listener came up.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
