[workspace]
resolver = "2"
members = [
    "crates/olduvai-core",
    "crates/olduvai-server",
    "crates/olduvai-py",
    "crates/olduvai-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/olduvai-exchange/olduvai"

[workspace.dependencies]
olduvai-core = { path = "crates/olduvai-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Server
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Bindings
# 0.29+ is required for CPython 3.14; 0.22 caps at 3.13 and fails its build script.
pyo3 = { version = "0.29", features = ["extension-module"] }
wasm-bindgen = "0.2"

# Test
proptest = "1"

[profile.release]
lto = true
codegen-units = 1

# The encoder must produce byte-identical addresses for every caller (note 30 §1).
# Fast-math or platform-specific float behaviour would break that silently.
[profile.release.package.olduvai-core]
opt-level = 2
